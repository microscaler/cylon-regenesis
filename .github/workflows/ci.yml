name: Deprecated repository guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retirement:
    name: Verify frozen state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout historical source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify deprecation contract
        run: |
          set -euo pipefail
          test -f docs/DEPRECATION.md
          test -f adrs/ADR-0007-deprecate-in-favour-of-aether-native-kvm.md
          grep -q 'Status:.*Accepted' adrs/ADR-0007-deprecate-in-favour-of-aether-native-kvm.md
          grep -q 'frozen pending archival' README.md
          if grep -q 'multipass launch' justfile; then
            echo 'supported justfile must not launch Multipass' >&2
            exit 1
          fi
          echo 'cylon-regenesis remains deprecated and non-releasable'
